<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Wudi987">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="shine" x1="16" y1="10" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0F766E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="2" y="2" width="76" height="76" rx="18" ry="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="76" height="76" rx="18" ry="18" fill="url(#shine)"/>

  <!-- abstract W mark -->
  <g filter="url(#soft)" fill="none" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 26 L26 54 L40 34 L54 54 L62 26"/>
  </g>

  <!-- small tech node accents -->
  <circle cx="40" cy="34" r="2.4" fill="#ECFEFF"/>
  <circle cx="26" cy="54" r="2.1" fill="#A5F3FC"/>
  <circle cx="54" cy="54" r="2.1" fill="#A5F3FC"/>

  <!-- brand text -->
  <text x="40" y="69" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="0.6"
        fill="#F0FDFA">WUDI987</text>
