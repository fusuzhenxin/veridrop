<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f3f8" />
      <stop offset="100%" stop-color="#d9e2ec" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4556">
        <animate attributeName="stop-color" values="#3a4556;#4a6fa5;#3a4556" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a202c">
        <animate attributeName="stop-color" values="#1a202c;#2a3550;#1a202c" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="16" stdDeviation="16" flood-color="#9fb3c8" flood-opacity="0.65" />
      <feDropShadow dx="-8" dy="-8" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.7" />
    </filter>

    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
        <stop offset="8%" stop-color="#ffffff" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- moving shine sweep -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="46" y="46" width="420" height="420" rx="100" />
    </clipPath>
  </defs>

  <!-- whole logo gently breathing / floating -->
  <g transform-origin="256 256">
    <animateTransform attributeName="transform" type="scale"
      values="1;1.025;1" dur="4s" repeatCount="indefinite"
      additive="sum" calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1" />
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"
      additive="sum" calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1" />

    <rect x="46" y="46" width="420" height="420" rx="100" fill="url(#bgGrad)" filter="url(#outerShadow)" />

    <rect x="46" y="46" width="420" height="420" rx="100" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />

    <rect x="46" y="46" width="420" height="420" rx="100" fill="url(#glossGrad)" />

    <!-- diagonal shine sweeping across the card -->
    <g clip-path="url(#cardClip)">
      <rect x="-260" y="46" width="180" height="420" fill="url(#shineGrad)" transform="skewX(-20)" opacity="0.8">
        <animate attributeName="x" values="-260;620" dur="4.5s" begin="0s;6s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- QwQ with subtle pulse -->
    <text x="256" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="175" text-anchor="middle" fill="url(#textGrad)" filter="url(#textShadow)" letter-spacing="-8" transform-origin="256 250">
      <animateTransform attributeName="transform" type="scale"
        values="1;1.04;1" dur="3s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1" />
      QwQ
    </text>

    <!-- API with fading shimmer -->
    <text x="256" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="60" text-anchor="middle" fill="#718096" filter="url(#textShadow)" letter-spacing="10">
      <animate attributeName="fill" values="#718096;#4a6fa5;#718096" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
      API
    </text>
  </g>
</svg>
