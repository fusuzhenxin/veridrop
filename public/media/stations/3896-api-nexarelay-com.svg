<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  
  <!-- 外框 -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="white" stroke="url(#grad3)" stroke-width="3"/>
  
  <!-- 主图形：中继节点 + 连接线 -->
  <!-- 左节点 -->
  <circle cx="55" cy="100" r="18" fill="white" stroke="url(#grad3)" stroke-width="2.5"/>
  <circle cx="55" cy="100" r="9" fill="url(#grad3)"/>
  
  <!-- 右节点 -->
  <circle cx="145" cy="100" r="18" fill="white" stroke="url(#grad3)" stroke-width="2.5"/>
  <circle cx="145" cy="100" r="9" fill="url(#grad3)"/>
  
  <!-- 上节点 -->
  <circle cx="100" cy="55" r="18" fill="white" stroke="url(#grad3)" stroke-width="2.5"/>
  <circle cx="100" cy="55" r="9" fill="url(#grad3)"/>
  
  <!-- 下节点 -->
  <circle cx="100" cy="145" r="18" fill="white" stroke="url(#grad3)" stroke-width="2.5"/>
  <circle cx="100" cy="145" r="9" fill="url(#grad3)"/>
  
  <!-- 连接线，形成 N 形 -->
  <path d="M 55 100 L 100 55 L 145 100 L 100 145 L 55 100" 
        fill="none" stroke="url(#grad3)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 中心 -->
  <circle cx="100" cy="100" r="14" fill="url(#grad3)" stroke="white" stroke-width="2"/>
</svg>