<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay</title>
  <desc id="desc">AI 编程与生图体验入口</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.48" stop-color="#071623"/>
      <stop offset="1" stop-color="#090b18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61e7ff"/>
      <stop offset="1" stop-color="#7dffbf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#61e7ff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".7"/>
  <circle cx="180" cy="132" r="220" fill="#61e7ff" opacity=".16" filter="url(#glow)"/>
  <circle cx="1020" cy="88" r="210" fill="#9c7bff" opacity=".16" filter="url(#glow)"/>
  <circle cx="950" cy="520" r="190" fill="#7dffbf" opacity=".11" filter="url(#glow)"/>
  <g transform="translate(92 96)">
    <rect x="0" y="0" width="1016" height="438" rx="42" fill="#081018" fill-opacity=".78" stroke="#89ddff" stroke-opacity=".22"/>
    <rect x="38" y="42" width="90" height="90" rx="45" fill="url(#line)" filter="url(#glow)"/>
    <circle cx="70" cy="70" r="10" fill="#fff" opacity=".92"/>
    <text x="154" y="92" fill="#eef7ff" font-family="Avenir Next, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="800">Codex Relay</text>
    <text x="42" y="220" fill="#eef7ff" font-family="Avenir Next, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">AI 编程与生图体验入口</text>
    <text x="46" y="286" fill="#8da1b3" font-family="Avenir Next, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30">GPT-5.6 系列 · 0.15 倍率 · AI 生图测试</text>
    <g transform="translate(46 344)">
      <rect width="178" height="58" rx="29" fill="#61e7ff"/>
      <text x="34" y="38" fill="#031014" font-family="Avenir Next, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="900">立即注册</text>
      <rect x="198" width="208" height="58" rx="29" fill="#ffffff" fill-opacity=".07" stroke="#89ddff" stroke-opacity=".22"/>
      <text x="232" y="38" fill="#eef7ff" font-family="Avenir Next, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800">AI 生图测试中</text>
    </g>
