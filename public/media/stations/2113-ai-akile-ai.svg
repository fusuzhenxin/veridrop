<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="akg-t akg-d">
  <title id="akg-t">Akile AI Gateway mark</title>
  <desc id="akg-d">A blue hexagonal mark: one request routed through the gateway and fanned out to multiple backends, with a green live node.</desc>
  <defs>
    <linearGradient id="akg-bg" x1="14" y1="10" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33C2FF"/>
      <stop offset="0.52" stop-color="#257CFF"/>
      <stop offset="1" stop-color="#165DFF"/>
    </linearGradient>
    <filter id="akg-shadow" x="0" y="0" width="96" height="96" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#165DFF" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#akg-shadow)">
    <!-- 官方六边形容器 + 品牌渐变 -->
    <path d="M48 8.5 78.744 26.25v35.5L48 79.5 17.256 61.75v-35.5L48 8.5Z" fill="url(#akg-bg)"/>
    <path d="M48 14.7 73.375 29.35v29.3L48 73.3 22.625 58.65v-29.3L48 14.7Z" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>

    <!-- 路由:入口箭头 → 枢纽 → 扇出三路 -->
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 44 H43"/>
      <path d="M37 39 L43 44 L37 49"/>
      <path d="M48 44 L64 31"/>
      <path d="M48 44 H66"/>
      <path d="M48 44 L64 57"/>
    </g>
    <circle cx="47.5" cy="44" r="5.4" fill="#fff"/>
    <circle cx="67" cy="44" r="2.7" fill="#fff"/>
    <circle cx="65.5" cy="57" r="2.7" fill="#fff"/>
    <!-- 顶部端点 = 绿色在线节点(品牌签名) -->
    <circle cx="66.5" cy="30.5" r="4.1" fill="#3ED88A" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
