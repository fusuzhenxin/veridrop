<svg id="shop-logo" style="width:100%;height:100%;display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shop logo motion-ready vector preview</title>
  <desc id="desc">A smooth vector reconstruction of the source shop logo with semantic ribbon and hexagon parts for animation.</desc>
  <style>
@media (prefers-reduced-motion: no-preference) {
#shop-logo {
  --p2m-duration: 1800ms;
  --p2m-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
  --p2m-ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
  --p2m-ease-narrative: cubic-bezier(0.34, 0, 0.14, 1);
  overflow: visible;
}

#logo-symbol,
#hex-frame,
.ribbon,
#motion-glints {
  transform-box: fill-box;
  transform-origin: center;
}

#logo-symbol {
  animation: p2m-symbol-settle var(--p2m-duration) linear both;
}

#hex-stroke,
#hex-depth,
#hex-highlight,
.draw-path {
  stroke-dasharray: 1 1;
  stroke-dashoffset: 0;
}

#hex-stroke,
#hex-depth {
  animation: p2m-hex-draw var(--p2m-duration) linear both;
}

#hex-highlight {
  animation: p2m-hex-highlight var(--p2m-duration) linear both;
}

.ribbon {
  opacity: 1;
}

.ribbon .draw-path {
  animation-duration: var(--p2m-duration);
  animation-timing-function: linear;
  animation-fill-mode: both;
}

#ribbon-blue {
  animation: p2m-blue-body var(--p2m-duration) linear both;
}

#ribbon-blue .draw-path {
  animation-name: p2m-blue-draw;
}

#ribbon-teal {
  animation: p2m-teal-body var(--p2m-duration) linear both;
}

#ribbon-teal .draw-path {
  animation-name: p2m-teal-draw;
}

#ribbon-orange {
  animation: p2m-orange-body var(--p2m-duration) linear both;
}

#ribbon-orange .draw-path {
  animation-name: p2m-orange-draw;
}

#ribbon-magenta {
  animation: p2m-magenta-body var(--p2m-duration) linear both;
}

#ribbon-magenta .draw-path {
  animation-name: p2m-magenta-draw;
}

#ribbon-green {
  animation: p2m-green-body var(--p2m-duration) linear both;
}

#ribbon-green .draw-path {
  animation-name: p2m-green-draw;
}

#ribbon-yellow {
  animation: p2m-yellow-body var(--p2m-duration) linear both;
}

#ribbon-yellow .draw-path {
  animation-name: p2m-yellow-draw;
}

#motion-glints {
  animation: p2m-glints var(--p2m-duration) linear both;
}

#glint-a {
  animation: p2m-glint-a var(--p2m-duration) linear both;
}

#glint-b {
  animation: p2m-glint-b var(--p2m-duration) linear both;
}

#glint-c {
  animation: p2m-glint-c var(--p2m-duration) linear both;
}

@keyframes p2m-symbol-settle {
  0% {
    opacity: 0;
    transform: translateY(26px) scale(0.92);
    filter: saturate(0.8) blur(5px);
    animation-timing-function: cubic-bezier(0.34, 0, 0.14, 1);
  }
  18% {
    opacity: 1;
    transform: translateY(18px) scale(0.9);
    filter: saturate(0.95) blur(2px);
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }
  66% {
    opacity: 1;
    transform: translateY(-5px) scale(1.025);
    filter: saturate(1.08) blur(0);
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
  }
  84% {
    transform: translateY(2px) scale(0.992);
    filter: saturate(1) blur(0);
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: saturate(1) blur(0);
  }
