  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="99" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

  <!-- HX monogram: the H crossbar becomes the relay path into the X. -->
