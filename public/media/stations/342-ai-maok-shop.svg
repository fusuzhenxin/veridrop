  <!-- Relay nodes remain legible at favicon size. -->
  <circle cx="104" cy="125" r="17" fill="#F8FAFC"/>
  <circle cx="225" cy="256" r="18" fill="#F8FAFC"/>
  <circle cx="412" cy="133" r="17" fill="#FFB84D"/>
  <circle cx="412" cy="379" r="17" fill="#F8FAFC"/>
