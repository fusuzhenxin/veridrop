      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#071A2F"/>
    </linearGradient>
    <linearGradient id="signal" x1="82" y1="94" x2="430" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48E6D2"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#4F7CFF"/>
