<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 清爽淡雅的 RouterApi Logo -->

  <!-- 背景 - 柔和渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#bg)"/>

  <!-- R 字母 - 简约线条风格 -->
  <g fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- R 的竖线 -->
    <line x1="35" y1="30" x2="35" y2="90"/>

    <!-- R 的上半部分弧线 -->
    <path d="M35 30 L35 30 C35 30 75 30 75 50 C75 70 35 70 35 70"/>

    <!-- R 的斜腿 -->
    <line x1="35" y1="70" x2="75" y2="90"/>
  </g>

  <!-- 路由连接点装饰 -->
  <circle cx="35" cy="30" r="4" fill="#6366f1"/>
  <circle cx="35" cy="90" r="4" fill="#6366f1"/>
  <circle cx="75" cy="50" r="3" fill="#818cf8"/>
</svg>