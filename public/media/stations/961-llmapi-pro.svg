<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAF6F1"/>
  <rect x="0" y="0" width="1200" height="5" fill="#D97757"/>

  <!-- Logo -->
  <text x="600" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="900" fill="#1A1915" letter-spacing="-3">LLM API</text>

  <!-- Tagline -->
  <text x="600" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#1A1915">
    <tspan>Claude 旗舰，</tspan><tspan fill="#D97757">全模型一个密钥直达</tspan>
  </text>

  <!-- Feature pills -->
  <g transform="translate(600, 370)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-460" y="-20" width="200" height="40" rx="20" fill="#D97757" opacity="0.1"/>
    <text x="-360" y="6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#D97757">不限 Token 用量</text>
    <!-- Pill 2 -->
    <rect x="-220" y="-20" width="180" height="40" rx="20" fill="#D97757" opacity="0.1"/>
    <text x="-130" y="6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#D97757">远程控制</text>
    <!-- Pill 3 -->
    <rect x="0" y="-20" width="180" height="40" rx="20" fill="#D97757" opacity="0.1"/>
    <text x="90" y="6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#D97757">国内直连</text>
    <!-- Pill 4 -->
    <rect x="220" y="-20" width="180" height="40" rx="20" fill="#22c55e" opacity="0.1"/>
    <text x="310" y="6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#16a34a">¥59/月 起</text>
  </g>

  <!-- Pricing comparison -->
  <g transform="translate(600, 460)" text-anchor="middle">
    <text font-family="Inter, system-ui, sans-serif" font-size="22" fill="#8a8578">
      <tspan>Pro ¥59</tspan>
      <tspan dx="30">Max ¥259</tspan>
      <tspan dx="30">Ultra ¥979</tspan>
    </text>
  </g>

  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#8a8578" letter-spacing="3">llmapi.pro</text>

  <!-- Bottom accent -->
  <rect x="0" y="625" width="1200" height="5" fill="#D97757"/>
</svg>
